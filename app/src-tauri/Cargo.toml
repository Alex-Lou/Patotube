[package]
name = "patotube"
version = "0.1.1"
description = "Modern lightweight media downloader"
authors = ["Patotube contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "patotube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "io-util"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
dashmap = "6"
url = "2"

# --- Mobile-only: native YouTube extractor ---
# yt-dlp has no Android port. Instead of pulling rustypipe + rquickjs
# (heavy cross-compile setup for QuickJS), we hit YouTube's internal
# `youtubei/v1/player` API directly with the ANDROID client signature,
# which returns un-encrypted CDN URLs and side-steps JS deobfuscation
# entirely. Same trick yt-dlp's `--player-client=android` uses.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json"] }
futures-util = "0.3"
# Pure-Rust MP4 box parser/writer. Used to strip the video track from
# the combined MP4 we fall back to when YouTube refuses real audio-only
# streams, producing a true audio-only .m4a without ffmpeg on Android.
mp4 = "0.14"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
