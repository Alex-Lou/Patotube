[package]
name = "patotube"
version = "0.6.9"
description = "Modern lightweight media downloader"
authors = ["Patotube contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "patotube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
# Required by deep-link on desktop: without it, every patotube://
# click spawns a fresh Patotube process instead of forwarding the
# URL to the already-open instance.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "io-util"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
dashmap = "6"
url = "2"
# YouTube signature / n-parameter decoding (Phase 2 of the kernel).
# Pure Rust means no NDK clang issues; we promote them to top-level
# deps so the sigcipher unit tests run on the desktop host as well as
# Android. boa is slower than QuickJS but the scripts are tiny
# (<5 KB) and run once per video, so it's unnoticeable. See
# docs/youtube-kernel.md ("Phase 2").
boa_engine = "0.21"
regex = "1"

# Promoted to top-level: SoundCloud / Bandcamp / Internet Archive
# kernels run on desktop too now (faster than spawning yt-dlp for
# every metadata fetch — especially for SoundCloud, where their
# api-v2 returns in <500 ms vs yt-dlp's 3-5 s subprocess + page
# parse). YouTube continues to use the yt-dlp sidecar on desktop
# because its extraction needs the full yt-dlp signature/n-param
# machinery our Rust sigcipher doesn't yet match.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json"] }
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
