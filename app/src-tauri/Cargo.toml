[package]
name = "patotube"
version = "0.1.1"
description = "Modern lightweight media downloader"
authors = ["Patotube contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "patotube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Native Android YouTube extractor (NewPipe-style, pure Rust) is on the
# v0.2.0 roadmap — it requires cross-compile setup for the QuickJS dep
# of rustypipe (rquickjs-sys ships no pre-generated bindings for
# aarch64-linux-android). For 0.1.x the APK installs and shows the UI,
# but yt-dlp is not available so fetches surface a clear error instead.

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "io-util"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
dashmap = "6"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
