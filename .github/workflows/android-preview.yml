name: Android preview APK

# Builds an arm64 APK from any `preview/**` branch and publishes it as a
# GitHub *pre-release*, so a test build can be installed straight from
# a phone. Pre-releases are never "latest": the landing page and the
# updater keep pointing at the last real release.
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build + publish preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: pnpm install --frozen-lockfile

      # gen/android is not committed: generate it, then drop the
      # customised Kotlin / manifest / gradle files from android-overlay.
      - name: Generate the Android project
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm tauri android init --ci
          pnpm android:sync

      - name: Build APK (arm64)
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm tauri android build --apk --target aarch64 --ci

      - name: Collect APK
        id: apk
        run: |
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk' | head -n1)
          test -n "$apk" || { echo "no release APK produced"; exit 1; }
          cp "$apk" Patotube-preview.apk
          version=$(node -p "require('./app/package.json').version")
          echo "tag=v${version}-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Patotube ${{ steps.apk.outputs.tag }} (test build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Patotube-preview.apk
          body: |
            **Test build — not a release.** Built from `${{ github.ref_name }}` @ `${{ github.sha }}`.

            - arm64 only (every recent phone).
            - Signed with a CI key: uninstall the current Patotube first
              (downloaded files in Download/ are kept).
